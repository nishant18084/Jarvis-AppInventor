name: Build Nexus OS Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check project ZIP
        run: |
          ls -la
          test -f NexusOS_Launcher_v1.zip
          unzip -l NexusOS_Launcher_v1.zip

      - name: Extract Nexus OS project
        run: |
          rm -rf NexusOSLauncher
          unzip -o NexusOS_Launcher_v1.zip
          test -f NexusOSLauncher/settings.gradle
          test -f NexusOSLauncher/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: NexusOSLauncher
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK
        run: |
          ls -lh NexusOSLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-Launcher-v1
          path: NexusOSLauncher/app/build/outputs/apk/debug/app-debug.apk
